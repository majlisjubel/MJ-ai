<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sambung Ayat - Qur'an Memory Arena</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    /* Styling Khusus Arena Voice Sambung Ayat */
    .arena-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 24px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #eab308;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      color: #fff;
      text-align: center;
    }

    .scroll-box {
      background: #fffbeb;
      color: #1e293b;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #d97706;
      margin-bottom: 24px;
    }

    .arabic-prompt {
      font-size: 1.8rem;
      font-family: 'Amiri', 'Traditional Arabic', serif;
      direction: rtl;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .instruction-text {
      font-size: 0.95rem;
      color: #64748b;
    }

    /* Tombol Mic Utama */
    .mic-button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border: 4px solid #fef08a;
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mic-btn:hover {
      transform: scale(1.05);
    }

    /* State Saat Merekam (Recording Ring Animation) */
    .mic-btn.recording {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      animation: pulse-ring 1.5s infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .status-badge {
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: #fbbf24;
    }

    /* Transcript & Feedback Box */
    .transcript-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      min-height: 50px;
    }

    .transcript-text {
      font-size: 1.2rem;
      color: #38bdf8;
      direction: rtl;
    }

    .feedback-message {
      font-weight: bold;
      margin-top: 12px;
      font-size: 1.1rem;
    }

    .feedback-message.success { color: #4ade80; }
    .feedback-message.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="arena-container">
    <h2>🎙️ SAMBUNG AYAT</h2>
    <p>Dengarkan/baca potongan ayat di bawah, lalu sambung ayat berikutnya dengan suaramu!</p>

    <!-- Scroll Teks Ayat -->
    <div class="scroll-box">
      <div id="versePrompt" class="arabic-prompt">Memuat soal...</div>
      <div id="surahInfo" class="instruction-text">Silakan tunggu...</div>
    </div>

    <!-- Interface Perekam Suara -->
    <div class="mic-button-container">
      <button id="micBtn" class="mic-btn" title="Tekan untuk rekam">🎙️</button>
      <span id="statusBadge" class="status-badge">Tekan Tombol Mic untuk Mulai</span>
    </div>

    <!-- Live Transcript Whisper AI -->
    <div class="transcript-box">
      <small style="color: #94a3b8;">Hasil Lafal Suaramu (Whisper AI):</small>
      <div id="userTranscript" class="transcript-text">-</div>
    </div>

    <div id="feedbackMsg" class="feedback-message"></div>

    <button id="nextBtn" style="display:none; margin-top: 15px; padding: 10px 20px; border-radius: 8px; background: #eab308; border: none; font-weight: bold; cursor: pointer;">Soal Berikutnya ➡️</button>
  </div>

  <script src="sambung.js"></script>
</body>
  </html>
