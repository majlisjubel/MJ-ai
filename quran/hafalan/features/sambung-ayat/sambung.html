<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sambung Ayat - Qur'an Memory Arena</title>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../../style.css">
  <style>
    :root {
      --gold: #facc15;
      --border-gold: #f59e0b;
    }
    body {
      margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
      background: #061018 url('https://images.unsplash.com/photo-1564507592333-c60657eea523?q=80&w=1000') no-repeat center center fixed;
      background-size: cover; color: #fff; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .arena-game-container {
      width: 100%; max-width: 480px; min-height: 100vh;
      background: linear-gradient(to bottom, rgba(6, 16, 24, 0.85), rgba(4, 11, 18, 0.95));
      backdrop-filter: blur(10px); display: flex; flex-direction: column;
      justify-content: space-between; padding: 16px; box-sizing: border-box;
      box-shadow: 0 0 40px rgba(0,0,0,0.8); position: relative;
    }
    .top-status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.85); border: 2px solid var(--border-gold);
      border-radius: 16px; padding: 8px 14px;
    }
    .back-btn {
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8); color: #fff;
      border: 1px solid var(--gold); padding: 6px 14px; border-radius: 10px;
      font-weight: bold; cursor: pointer; font-size: 0.8rem; text-decoration: none;
    }
    .user-stats-mini { display: flex; align-items: center; gap: 8px; }
    .stat-badge {
      background: rgba(0, 0, 0, 0.6); border: 1px solid var(--gold);
      padding: 4px 10px; border-radius: 10px; color: var(--gold);
      font-weight: 700; font-size: 0.8rem;
    }
    .mode-title-banner {
      text-align: center; background: linear-gradient(135deg, #065f46, #064e3b);
      border: 2px solid var(--gold); border-radius: 16px; padding: 10px; margin: 8px 0;
    }
    .mode-title-banner h2 { margin: 0; font-size: 1.15rem; color: var(--gold); }
    .mode-title-banner p { margin: 3px 0 0; font-size: 0.75rem; color: #6ee7b7; }
    .verse-frame {
      background: linear-gradient(to bottom, #fffbeb, #fef3c7); color: #0f172a;
      border: 3px solid var(--border-gold); border-radius: 20px; padding: 16px; text-align: center;
    }
    .verse-badge {
      background: #047857; color: #fff; font-size: 0.75rem; padding: 4px 12px;
      border-radius: 12px; font-weight: bold; display: inline-block; margin-bottom: 8px;
    }
    .arabic-display {
      font-family: 'Amiri', serif; font-size: 1.8rem; direction: rtl; line-height: 1.8; color: #0f172a; margin-bottom: 6px; font-weight: 700;
    }
    .translation-text { font-size: 0.8rem; color: #334155; font-style: italic; font-weight: 500; }
    .audio-prompt-banner {
      background: linear-gradient(135deg, #1e3a8a, #1e40af); border: 2px solid #93c5fd;
      color: #fff; text-align: center; padding: 8px 12px; border-radius: 14px; font-size: 0.82rem; margin: 8px 0; font-weight: 600;
    }
    .interaction-arena { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; padding: 0 10px; }
    .anime-avatar-box {
      width: 55px; height: 55px; background: rgba(15, 23, 42, 0.8);
      border: 2px solid var(--gold); border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 1.8rem;
    }
    .mic-main-btn {
      width: 85px; height: 85px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: 4px solid var(--gold);
      color: #fff; font-size: 2.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .mic-main-btn.recording { background: linear-gradient(135deg, #ef4444, #991b1b); border-color: #fca5a5; animation: pulse-mic 1.2s infinite; }
    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 22px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .status-indicator { text-align: center; font-size: 0.78rem; color: var(--gold); font-weight: 600; margin-bottom: 2px; }
    .transcript-box {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 12px; padding: 8px; text-align: center; min-height: 35px; font-size: 0.85rem; color: #38bdf8; direction: rtl;
    }
    .footer-game-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .panel-box {
      background: rgba(15, 23, 42, 0.9); border: 2px solid var(--border-gold);
      border-radius: 14px; padding: 6px 14px; font-size: 0.75rem; text-align: center; font-weight: 500; color: #94a3b8;
    }
    .panel-box span { display: block; color: var(--gold); font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="arena-game-container">
    <div class="top-status-bar">
      <a href="../../index.html" class="back-btn">‹ Kembali</a>
      <div class="user-stats-mini">
        <div class="stat-badge" id="coinDisplay">🪙 1.250</div>
        <div class="stat-badge" id="xpDisplay">⭐ 0 XP</div>
      </div>
    </div>

    <div class="mode-title-banner">
      <h2>🎙️ SAMBUNG AYAT</h2>
      <p>Dengarkan • Ucapkan • Raih Poin</p>
    </div>

    <div class="verse-frame">
      <div id="surahInfo" class="verse-badge">Memuat Ayat...</div>
      <div id="versePrompt" class="arabic-display">...</div>
      <div class="translation-text" id="verseTrans">"Memuat terjemahan..."</div>
    </div>

    <div class="audio-prompt-banner">
      🔊 Lanjutkan ayat berikutnya dengan suara kamu...
    </div>

    <div id="statusBadge" class="status-indicator">Memuat sistem...</div>

    <div class="interaction-arena">
      <div class="anime-avatar-box" id="userAvatarIcon">👦</div>
      <button id="micBtn" class="mic-main-btn" title="Tekan untuk Rekam">🎙️</button>
      <div class="anime-avatar-box">🐱</div>
    </div>

    <div class="transcript-box">
      <small style="display:block; color:#94a3b8; font-size: 0.65rem;">Hasil Lafal Suaramu (Whisper AI):</small>
      <span id="userTranscript">-</span>
    </div>

    <div id="feedbackMsg" style="text-align:center; font-weight:bold; font-size:0.85rem; min-height: 18px;"></div>

    <div class="footer-game-panel">
      <div class="panel-box">
        Sisa Waktu
        <span id="timerText">01:30</span>
      </div>
      <button id="nextBtn" style="display:none;" class="back-btn" style="background: linear-gradient(135deg, #059669, #047857);">Soal Berikutnya ➡️</button>
      <div class="panel-box">
        Total XP
        <span id="scoreText">0</span>
      </div>
    </div>
  </div>

  <script src="sambung.js"></script>
</body>
</html>
