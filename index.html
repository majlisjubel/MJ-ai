<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090406">
<title>MJ AI - Majlis Jubel Intelligence</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  /* Nuansa gelap pekat dengan efek gradasi merah darah & bulan merah */
  background-color: #050203;
  background-image: 
    radial-gradient(circle at 85% 10%, rgba(200, 16, 46, 0.25) 0%, transparent 40%),
    radial-gradient(circle at 15% 90%, rgba(100, 10, 20, 0.2) 0%, transparent 50%);
  color: #f1d6d8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}
main {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: rgba(9, 4, 6, 0.85);
  backdrop-filter: blur(10px);
  border-left: 1px solid #330d12;
  border-right: 1px solid #330d12;
  box-shadow: 0 0 40px rgba(150, 10, 25, 0.15);
}
header {
  padding: 16px;
  background: rgba(13, 5, 8, 0.95);
  border-bottom: 1px solid #330d12;
  text-align: center;
}
header h1 {
  font-size: 20px;
  color: #ff334b;
  letter-spacing: 3px;
  font-weight: 800;
  text-shadow: 0 0 10px rgba(255, 51, 75, 0.4);
}
header .sub {
  font-size: 10px;
  color: #a87d82;
  letter-spacing: 2px;
  margin-top: 2px;
}
header .status {
  font-size: 11px;
  color: #ff4d66;
  margin-top: 4px;
}
#chat-container {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
}
.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #800f1f, #c9184a);
  color: #ffffff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 15px rgba(201, 24, 74, 0.3);
}
.msg.bot {
  align-self: flex-start;
  background: #14080b;
  color: #f1d6d8;
  border: 1px solid #3d1218;
  border-bottom-left-radius: 4px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}
.typing {
  font-style: italic;
  color: #a87d82;
  font-size: 12px;
}
.input-panel {
  padding: 12px;
  background: rgba(13, 5, 8, 0.95);
  border-top: 1px solid #330d12;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.input-box {
  display: flex;
  gap: 8px;
}
input {
  flex: 1;
  padding: 12px 16px;
  background: #1a0a0f;
  border: 1px solid #4a151d;
  border-radius: 24px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
}
input:focus { 
  border-color: #ff334b; 
  box-shadow: 0 0 10px rgba(255, 51, 75, 0.2);
}
button {
  padding: 10px 16px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(135deg, #a4161a, #e5383b);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  box-shadow: 0 4px 12px rgba(229, 56, 59, 0.3);
  transition: opacity 0.2s;
}
button:active { opacity: 0.8; }
button:disabled { opacity: 0.4; }
.btn-secondary { 
  background: #1a0a0f; 
  border: 1px solid #4a151d; 
  color: #d9b8bc; 
  box-shadow: none;
}
.quick-btns {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.quick-btns::-webkit-scrollbar { display: none; }
.quick-btns button {
  white-space: nowrap;
  font-size: 11px;
  padding: 6px 12px;
}
</style>
</head>
<body>

<main>
 <header>
  <h1>MJ AI</h1>
  <div class="sub">MAJLIS JUBEL INTELLIGENCE</div>
  <div class="status" id="status">● SANGAT SIAP</div>
 </header>

 <div id="chat-container">
  <div class="msg bot">Salam, Ahli MJ! Terminal MJ AI diaktifkan di bawah langit malam merah. Ada yang bisa dibantu?</div>
 </div>

 <div class="input-panel">
  <div class="quick-btns">
   <button class="btn-secondary" onclick="sendQuick('Siapa kamu?')">👑 Siapa kamu?</button>
   <button class="btn-secondary" onclick="sendQuick('Jam berapa?')">⏰ Jam berapa?</button>
   <button class="btn-secondary" onclick="sendQuick('Halo MJ')">🔥 Halo MJ</button>
  </div>
  <div class="input-box">
   <input id="cmd" placeholder="Ketik pesan ke MJ..." autocomplete="off">
   <button id="send">Kirim</button>
   <button id="mic" class="btn-secondary">🎙️</button>
  </div>
 </div>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat-container');
const status = $('status');
const sendBtn = $('send');
const API = 'https://mj-ai-api.rkidul416.workers.dev/';

function addMsg(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function say(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    speechSynthesis.speak(u);
  }
}

async function run(q) {
  if (!q.trim()) return;
  
  addMsg(q, 'user');
  $('cmd').value = '';
  
  const loadingMsg = addMsg('MJ sedang meracik jawaban...', 'bot typing');
  status.innerText = '● MEMPROSES...';
  sendBtn.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q })
    });
    
    const data = await res.json();
    loadingMsg.remove();

    if (!res.ok) throw new Error(data.error || 'Gagal tersambung');

    addMsg(data.answer, 'bot');
    say(data.answer);
    status.innerText = '● ONLINE';

  } catch (err) {
    loadingMsg.remove();
    addMsg('Maaf, ralat koneksi: ' + err.message, 'bot');
    status.innerText = '● KONEKSI GAGAL';
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = () => run($('cmd').value);
$('cmd').onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };
function sendQuick(txt) { run(txt); }
</script>

</body>
</html>
