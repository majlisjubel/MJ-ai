<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050203">
<title>MJ AI - Visual Novel Mode</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background-color: #050203;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* WADAH SPRITE KARAKTER DI TENGAH LAYAR */
.vn-sprite-container {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
  z-index: 1; overflow: hidden;
}

#character-sprite {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  transition: opacity 0.2s ease-in-out;
}

.vn-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(to bottom, rgba(5, 2, 3, 0.2) 20%, rgba(5, 2, 3, 0.85) 75%);
  z-index: 2; pointer-events: none;
}

main {
  width: 100%; max-width: 480px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 12px; position: relative; z-index: 3;
}

.vn-top-bar {
  display: flex; gap: 10px; align-items: center; justify-content: space-between;
  width: 100%; font-size: 11px; background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(6px); padding: 6px 12px; border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.15); flex-shrink: 0; z-index: 10;
}
.vn-badge { background: rgba(181, 23, 47, 0.85); padding: 2px 8px; border-radius: 10px; font-weight: bold; }
.vn-status-group { display: flex; align-items: center; gap: 8px; }

#chat-container {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  justify-content: flex-start; gap: 14px; padding: 14px 2px;
  scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
}

.vn-dialogue {
  background: rgba(10, 3, 5, 0.7); backdrop-filter: blur(6px);
  border-top: 1px solid rgba(255, 77, 102, 0.4); border-bottom: 1px solid rgba(255, 77, 102, 0.4);
  padding: 12px 18px; font-size: 14.5px; line-height: 1.7; color: #ffffff;
  text-align: left; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
  animation: fadeIn 0.3s ease-in-out; word-wrap: break-word; border-radius: 10px;
}

.vn-dialogue.user-action {
  background: rgba(181, 23, 47, 0.6); border-color: rgba(255, 51, 75, 0.8);
  color: #ffccd5; font-style: italic; text-align: right;
  border-radius: 10px; border-top: none; border-bottom: none;
}

.audio-play-btn {
  display: inline-block; margin-left: 8px; background: rgba(181, 23, 47, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; border-radius: 50%;
  width: 26px; height: 26px; font-size: 12px; cursor: pointer; vertical-align: middle;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.vn-input-panel {
  background: rgba(12, 4, 6, 0.9); backdrop-filter: blur(12px);
  border: 1px solid rgba(181, 23, 47, 0.5); border-radius: 16px;
  padding: 8px 12px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8); flex-shrink: 0; z-index: 10;
}

.vn-input-panel input {
  flex: 1; background: transparent; border: none; color: #fff;
  font-size: 14px; outline: none; padding: 8px;
}
.vn-input-panel input::placeholder { color: rgba(255, 255, 255, 0.4); }

.vn-send-btn {
  background: #b5172f; border: none; width: 38px; height: 38px;
  border-radius: 50%; display: grid; place-items: center; color: white;
  cursor: pointer; box-shadow: 0 2px 10px rgba(181, 23, 47, 0.5); flex-shrink: 0;
}
.vn-send-btn:disabled { opacity: 0.4; }
.vn-icon-btn { background: transparent; border: none; color: #d1a3a8; font-size: 18px; cursor: pointer; padding: 4px; transition: transform 0.2s, color 0.2s; }
.vn-icon-btn.active { color: #ff4d66; }
.vn-icon-btn.recording { color: #ff4d66; transform: scale(1.2); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>

  <!-- ELEMEN GAMBAR SPRITE UTAMA -->
  <div class="vn-sprite-container">
    <img id="character-sprite" src="https://i.ibb.co/gbPmMmcK/file-00000000d8c08207ac4c93cd9137f78e.png" alt="MJ Sprite">
  </div>
  <div class="vn-overlay"></div>

<main>
  <div class="vn-top-bar">
    <div>👑 <span class="vn-badge">MJ AI</span></div>
    <div class="vn-status-group">
      <button class="vn-icon-btn" id="key-btn" title="Verifikasi">🔑</button>
      <span>💬 <span id="status">Online</span></span>
    </div>
  </div>

  <div id="chat-container">
    <div class="vn-dialogue">
      "Haiii, saya MJ, asisten pribadi virtual. Ada yang bisa saya bantu?"
    </div>
  </div>

  <div class="vn-input-panel">
    <button class="vn-icon-btn" id="mic">🎙️</button>
    <input id="cmd" placeholder="Masukkan dialog atau tindakan..." autocomplete="off">
    <button class="vn-send-btn" id="send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat-container');
const status = $('status');
const sendBtn = $('send');
const micBtn = $('mic');
const keyBtn = $('key-btn');
const spriteImg = $('character-sprite');
const API = 'https://api.mj-ai.my.id/';

// 7 LINK FOTO EKSPRESI DARI TUAN
const sprites = {
  biasa: "https://i.ibb.co/gbPmMmcK/file-00000000d8c08207ac4c93cd9137f78e.png",
  senyum: "https://i.ibb.co/kFk326N/file-0000000088648211b2abc737acf9224e.png",
  kaget: "https://i.ibb.co/xqXyTQB4/file-000000000a8c82118bf468aa3778346c.png",
  mikir: "https://i.ibb.co/jCSqj2B/file-0000000084788211ac3f3af7788637a9.png",
  malu: "https://i.ibb.co/ZzBDB49X/file-00000000c2788211b812b3b97f270405.png",
  marah: "https://i.ibb.co/2YmgsChw/file-0000000088f48211adc8ead5d7fdc2c4.png",
  sedih: "https://i.ibb.co/4g06zDZ6/1792299320411.png"
};

const VALID_PIN = "10052003";
let userPIN = localStorage.getItem('MJ_PIN') || "";

function updateAccessUI() {
  if (userPIN === VALID_PIN) keyBtn.classList.add('active');
  else { userPIN = ""; localStorage.removeItem('MJ_PIN'); keyBtn.classList.remove('active'); }
}
updateAccessUI();

let currentAudio = null;
let history = [
  { role: 'model', parts: [{ text: 'Haiii, saya MJ, asisten pribadi virtual. Ada yang bisa saya bantu?' }] }
];

keyBtn.onclick = () => {
  const pin = prompt("Masukkan PIN Verifikasi Tuan Ibnu (Kosongkan jika Tamu):", userPIN);
  if (pin !== null) {
    const cleanPin = pin.trim();
    if (cleanPin === VALID_PIN) {
      userPIN = cleanPin;
      localStorage.setItem('MJ_PIN', userPIN);
      alert("Verifikasi Berhasil! MJ mengenali Tuan Ibnu.");
    } else {
      userPIN = "";
      localStorage.removeItem('MJ_PIN');
      alert("Masuk sebagai Mode Tamu.");
    }
    updateAccessUI();
  }
};

// FUNGSI GANTI EKSPRESI YANG TERHUBUNG LANGSUNG KE ELEMEN #character-sprite
function setExpressionByText(text) {
  const t = text.toLowerCase();
  let tag = 'biasa';

  if (t.includes('senyum') || t.includes('😊') || t.includes('haha') || t.includes('tentu') || t.includes('baik')) {
    tag = 'senyum';
  } else if (t.includes('kaget') || t.includes('apa') || t.includes('ha?') || t.includes('!?')) {
    tag = 'kaget';
  } else if (t.includes('mikir') || t.includes('hmm') || t.includes('coba') || t.includes('kitab')) {
    tag = 'mikir';
  } else if (t.includes('malu') || t.includes('ih') || t.includes('tersipu')) {
    tag = 'malu';
  } else if (t.includes('marah') || t.includes('jangan') || t.includes('awas')) {
    tag = 'marah';
  } else if (t.includes('sedih') || t.includes('maaf') || t.includes('sayang')) {
    tag = 'sedih';
  }

  const newImgUrl = sprites[tag] || sprites.biasa;
  if (spriteImg) {
    spriteImg.style.opacity = '0.2';
    setTimeout(() => {
      spriteImg.src = newImgUrl;
      spriteImg.style.opacity = '1';
    }, 150);
  }
}

function addDialogue(text, isUser = false, audioBase64 = null) {
  const div = document.createElement('div');
  div.className = isUser ? 'vn-dialogue user-action' : 'vn-dialogue';
  div.innerText = text;

  if (audioBase64 && !isUser) {
    const playBtn = document.createElement('button');
    playBtn.className = 'audio-play-btn';
    playBtn.innerText = '🔊';
    playBtn.onclick = () => playAudioResponse(audioBase64);
    div.appendChild(playBtn);
  }

  chat.appendChild(div);
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
  return div;
}

function playAudioResponse(audioBase64) {
  if (currentAudio) currentAudio.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (audioBase64) {
    try {
      currentAudio = new Audio("data:audio/mp3;base64," + audioBase64);
      currentAudio.play();
    } catch (e) { console.error("Audio error:", e); }
  }
}

async function run(q) {
  if (!q.trim()) return;
  
  addDialogue(q, true);
  $('cmd').value = '';
  history.push({ role: 'user', parts: [{ text: q }] });

  const loading = addDialogue('...');
  status.innerText = 'Memproses...';
  sendBtn.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        contents: history, 
        message: q,
        passcode: userPIN,
        pin: userPIN,
        pass: userPIN
      })
    });
    
    const data = await res.json();
    loading.remove();

    if (!res.ok) throw new Error(data.error || 'Gagal tersambung');

    let replyText = data.answer || "Maaf, tidak ada respon.";
    
    // UBAH GAMBAR BACKGROUND SEKETIKA BERDASARKAN BALASAN AI
    setExpressionByText(replyText);

    addDialogue(replyText, false, data.audio);
    
    history.push({ role: 'model', parts: [{ text: replyText }] });
    status.innerText = 'Online';

  } catch (err) {
    loading.remove();
    addDialogue('Ralat: ' + err.message);
    status.innerText = 'Error';
    history.pop();
  } finally {
    sendBtn.disabled = false;
  }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
micBtn.onclick = () => {
  if (!SpeechRecognition) return alert('Browser tidak mendukung mic.');
  const recognition = new SpeechRecognition();
  recognition.lang = 'id-ID';
  try {
    recognition.start();
    micBtn.classList.add('recording');
    status.innerText = 'Mendengarkan...';
  } catch (e) {
    micBtn.classList.remove('recording');
    status.innerText = 'Online';
  }
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    $('cmd').value = transcript;
    micBtn.classList.remove('recording');
    run(transcript);
  };
  recognition.onerror = () => { micBtn.classList.remove('recording'); status.innerText = 'Online'; };
  recognition.onend = () => { micBtn.classList.remove('recording'); status.innerText = 'Online'; };
};

sendBtn.onclick = () => run($('cmd').value);
$('cmd').onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };
</script>
</body>
</html>
