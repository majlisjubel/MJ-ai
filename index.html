<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050203">
<title>MJ AI - Visual Novel Mode</title>
<link rel="stylesheet" href="./style.css?v=4">
</head>
<body>

<main>
  <!-- Stage Karakter Sprite di Background -->
  <div class="vn-stage">
    <img id="mj-sprite" class="mj-sprite" src="./netral.png" alt="MJ Character">
  </div>

  <!-- Bar Atas -->
  <div class="vn-top-bar">
    <div>
      👑 <span class="vn-badge">MJ AI</span>
    </div>
    <div class="vn-status-group">
      <button class="vn-icon-btn" id="key-btn" title="Verifikasi Identitas Tuan">🔑</button>
      <span>💬 <span id="status">Online</span></span>
    </div>
  </div>

  <!-- Area Kotak Dialog VN Melayang Transparan -->
  <div id="chat-container">
    <div class="vn-dialogue">
      "Haiii, saya MJ, asisten pribadi virtual. Ada yang bisa saya bantu?"
    </div>
  </div>

  <!-- Panel Input Bawah -->
  <div class="vn-input-panel">
    <button class="vn-icon-btn" id="mic" title="Bicara lewat Suara">🎙️</button>
    <input id="cmd" placeholder="Masukkan dialog atau tindakan berikutnya..." autocomplete="off">
    <button class="vn-send-btn" id="send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</main>

<script src="./script.js?v=4"></script>
</body>
</html>
