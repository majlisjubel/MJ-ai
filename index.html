<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050203">
<title>MJ AI - Visual Novel Mode</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background-color: #050203;
  /* Background Kafe */
  background-image: linear-gradient(rgba(5, 2, 3, 0.4), rgba(5, 2, 3, 0.75)), url('./1792329882709.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

main {
  width: 100%;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
  position: relative;
}

.vn-top-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  font-size: 11px;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  flex-shrink: 0;
  z-index: 20;
}
.vn-badge {
  background: rgba(181, 23, 47, 0.85);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: bold;
}
.vn-status-group { display: flex; align-items: center; gap: 8px; }

/* Visual Novel Stage & Sprite Bernapas */
.vn-stage {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: relative;
  overflow: hidden;
  margin-bottom: -15px;
}

.mj-sprite {
  max-height: 82vh;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
  transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
  animation: breathing 4s ease-in-out infinite alternate;
}

@keyframes breathing {
  0% { transform: translateY(0px) scale(1); }
  100% { transform: translateY(-8px) scale(1.015); }
}

#chat-container {
  max-height: 180px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 10px;
  padding: 8px 2px;
  scroll-behavior: smooth;
  z-index: 10;
}

.vn-dialogue {
  background: rgba(10, 3, 5, 0.75);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255, 77, 102, 0.4);
  border-bottom: 1px solid rgba(255, 77, 102, 0.4);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #ffffff;
  text-align: center;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
  animation: fadeIn 0.3s ease-in-out;
  word-wrap: break-word;
  position: relative;
}

.vn-dialogue.user-action {
  background: rgba(181, 23, 47, 0.55);
  border-color: rgba(255, 51, 75, 0.7);
  color: #ffccd5;
  font-style: italic;
  text-align: right;
  border-radius: 10px;
  border-top: none;
  border-bottom: none;
}

.audio-play-btn {
  display: inline-block;
  margin-left: 8px;
  background: rgba(181, 23, 47, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  font-size: 12px;
  cursor: pointer;
  vertical-align: middle;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.vn-input-panel {
  background: rgba(12, 4, 6, 0.88);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(181, 23, 47, 0.4);
  border-radius: 16px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
  flex-shrink: 0;
  z-index: 20;
  margin-top: 6px;
}

.vn-input-panel input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 14px;
  outline: none;
  padding: 8px;
}
.vn-input-panel input::placeholder { color: rgba(255, 255, 255, 0.4); }

.vn-send-btn {
  background: #b5172f;
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(181, 23, 47, 0.5);
  flex-shrink: 0;
}
.vn-send-btn:disabled { opacity: 0.4; }

.vn-icon-btn {
  background: transparent;
  border: none;
  color: #d1a3a8;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  transition: transform 0.2s, color 0.2s;
}
.vn-icon-btn.active { color: #ff4d66; }
.vn-icon-btn.recording { color: #ff4d66; transform: scale(1.2); animation: pulse 1s infinite alternate; }

@keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>

<main>
  <div class="vn-top-bar">
    <div>👑 <span class="vn-badge">MJ AI</span></div>
    <div class="vn-status-group">
      <button class="vn-icon-btn" id="key-btn" title="Verifikasi">🔑</button>
      <span>💬 <span id="status">Online</span></span>
    </div>
  </div>

  <div class="vn-stage">
    <!-- Sprite awal menggunakan file netral -->
    <img id="mj-sprite" class="mj-sprite" src="./file_0000000088648211b2abc737ac.png" alt="MJ Character">
  </div>

  <div id="chat-container">
    <div class="vn-dialogue">
      "Haiii, saya MJ, asisten pribadi virtual. Ada yang bisa saya bantu?"
    </div>
  </div>

  <div class="vn-input-panel">
    <button class="vn-icon-btn" id="mic" title="Bicara">🎙️</button>
    <input id="cmd" placeholder="Masukkan dialog atau tindakan..." autocomplete="off">
    <button class="vn-send-btn" id="send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat-container');
const status = $('status');
const sendBtn = $('send');
const micBtn = $('mic');
const keyBtn = $('key-btn');
const mjSprite = $('mj-sprite');
const API = 'https://api.mj-ai.my.id/';

// Mapping ekspresi berdasarkan nama file yang baru lo upload
const EXPRESSIONS = {
  netral: './file_0000000088648211b2abc737ac.png',
  senang: './file_00000000a8c82118bf468aa37.png',
  sedih: './file_0000000084788211ac3f3af778.png',
  marah: './file_00000000c2788211b812b3b97f.png',
  kaget: './file_0000000088f48211adc8ead5d7.png',
  blushing: './file_00000000d8c08207ac4c93cd91.png',
  bingung: './1792299320411.png'
};

function changeExpression(expressionName) {
  if (EXPRESSIONS[expressionName]) {
    mjSprite.style.opacity = '0.3';
    setTimeout(() => {
      mjSprite.src = EXPRESSIONS[expressionName];
      mjSprite.style.opacity = '1';
    }, 150);
  }
}

function autoDetectExpression(text) {
  const lower = text.toLowerCase();
  if (lower.includes('haha') || lower.includes('senang') || lower.includes('suka') || lower.includes('😊')) changeExpression('senang');
  else if (lower.includes('maaf') || lower.includes('sedih') || lower.includes('😭')) changeExpression('sedih');
  else if (lower.includes('marah') || lower.includes('kesal') || lower.includes('😠')) changeExpression('marah');
  else if (lower.includes('wah') || lower.includes('kaget') || lower.includes('😲')) changeExpression('kaget');
  else if (lower.includes('malu') || lower.includes('tuan') || lower.includes('😳')) changeExpression('blushing');
  else if (lower.includes('bingung') || lower.includes('🤔')) changeExpression('bingung');
  else changeExpression('netral');
}

const VALID_PIN = "10052003";
let userPIN = localStorage.getItem('MJ_PIN') || "";

function updateAccessUI() {
  if (userPIN === VALID_PIN) keyBtn.classList.add('active');
  else { userPIN = ""; localStorage.removeItem('MJ_PIN'); keyBtn.classList.remove('active'); }
}
updateAccessUI();

let history = [{ role: 'model', parts: [{ text: 'Haiii, saya MJ, asisten pribadi virtual. Ada yang bisa saya bantu?' }] }];

keyBtn.onclick = () => {
  const pin = prompt("Masukkan PIN Verifikasi Tuan Ibnu:", userPIN);
  if (pin !== null) {
    const cleanPin = pin.trim();
    if (cleanPin === VALID_PIN) { userPIN = cleanPin; localStorage.setItem('MJ_PIN', userPIN); alert("Verifikasi Berhasil!"); }
    else { userPIN = ""; localStorage.removeItem('MJ_PIN'); alert("Mode Tamu."); }
    updateAccessUI();
  }
};

function addDialogue(text, isUser = false) {
  const div = document.createElement('div');
  div.className = isUser ? 'vn-dialogue user-action' : 'vn-dialogue';
  div.innerText = text;
  chat.appendChild(div);
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
  return div;
}

async function run(q) {
  if (!q.trim()) return;
  addDialogue(q, true);
  $('cmd').value = '';
  history.push({ role: 'user', parts: [{ text: q }] });

  const loading = addDialogue('...');
  status.innerText = 'Memproses...';
  sendBtn.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history, message: q, passcode: userPIN, pin: userPIN, pass: userPIN })
    });
    const data = await res.json();
    loading.remove();
    if (!res.ok) throw new Error(data.error || 'Gagal');

    const reply = data.answer || "Respon kosong.";
    addDialogue(reply, false);
    autoDetectExpression(reply);
    history.push({ role: 'model', parts: [{ text: reply }] });
    status.innerText = 'Online';
  } catch (err) {
    loading.remove();
    addDialogue('Ralat: ' + err.message);
    status.innerText = 'Error';
    history.pop();
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = () => run($('cmd').value);
$('cmd').onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };
</script>
</body>
</html>
