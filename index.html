<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050203">
<title>MJ AI - Visual Novel Mode</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  /* Background bisa diganti URL gambar karakter atau tema merah gelap khas MJ */
  background-color: #050203;
  background-image: linear-gradient(rgba(5, 2, 3, 0.6), rgba(5, 2, 3, 0.85)), url('https://ibb.co.com/V0QJWJk4');
  background-size: cover;
  background-position: center;
  color: #f3e8e8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

main {
  width: 100%;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
  position: relative;
}

/* Status Bar ala VN (Atas) */
.vn-top-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
  padding: 6px 12px;
  border-radius: 20px;
  align-self: flex-start;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.vn-badge {
  background: rgba(181, 23, 47, 0.8);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: bold;
}

/* Area Cerita / Narasi / Chat di Tengah */
#chat-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 12px;
  padding: 10px 0;
  scroll-behavior: smooth;
}

/* Kotak Narasi / Dialog bergaya Visual Novel */
.vn-dialogue {
  background: rgba(10, 3, 5, 0.75);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(181, 23, 47, 0.3);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #fce4e6;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  animation: fadeIn 0.3s ease-in-out;
}

.vn-dialogue.user-action {
  background: rgba(181, 23, 47, 0.35);
  border-color: rgba(255, 51, 75, 0.5);
  font-style: italic;
  text-align: right;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Panel Input Melayang di Bawah */
.vn-input-panel {
  background: rgba(12, 4, 6, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(181, 23, 47, 0.4);
  border-radius: 16px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
  flex-shrink: 0;
}

.vn-input-panel input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 14px;
  outline: none;
  padding: 8px;
}
.vn-input-panel input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

/* Tombol Kirim Melayang Khas */
.vn-send-btn {
  background: #b5172f;
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(181, 23, 47, 0.5);
  flex-shrink: 0;
}
.vn-send-btn:disabled { opacity: 0.4; }

.vn-icon-btn {
  background: transparent;
  border: none;
  color: #d1a3a8;
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
}
</style>
</head>
<body>

<main>
  <!-- Bar Atas ala Game VN -->
  <div class="vn-top-bar">
    <span>👑 <span class="vn-badge">MJ AI</span></span>
    <span>💬 <span id="status">Online</span></span>
  </div>

  <!-- Area Narasi / Dialog Utama -->
  <div id="chat-container">
    <div class="vn-dialogue">
      "Salam, Ahli MJ. Terminal Majlis Jubel Intelligence aktif di bawah bayang-bayang malam. Masukkan dialog atau tindakan berikutnya..."
    </div>
  </div>

  <!-- Panel Input Bawah Transparan -->
  <div class="vn-input-panel">
    <button class="vn-icon-btn" id="mic" title="Bicara">🎙️</button>
    <input id="cmd" placeholder="Masukkan dialog atau tindakan berikutnya..." autocomplete="off">
    <button class="vn-send-btn" id="send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat-container');
const status = $('status');
const sendBtn = $('send');
const API = 'https://mj-ai-api.rkidul416.workers.dev/';

function addDialogue(text, isUser = false) {
  const div = document.createElement('div');
  div.className = isUser ? 'vn-dialogue user-action' : 'vn-dialogue';
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function say(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    speechSynthesis.speak(u);
  }
}

async function run(q) {
  if (!q.trim()) return;
  
  addDialogue(q, true);
  $('cmd').value = '';
  
  const loading = addDialogue('MJ sedang memikirkan alur...');
  status.innerText = 'Memproses...';
  sendBtn.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q })
    });
    
    const data = await res.json();
    loading.remove();

    if (!res.ok) throw new Error(data.error || 'Gagal tersambung');

    addDialogue(data.answer, false);
    say(data.answer);
    status.innerText = 'Online';

  } catch (err) {
    loading.remove();
    addDialogue('Ralat: ' + err.message);
    status.innerText = 'Error';
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = () => run($('cmd').value);
$('cmd').onkeydown = e => { if (e.key === 'Enter') sendBtn.click(); };
</script>

</body>
</html>
